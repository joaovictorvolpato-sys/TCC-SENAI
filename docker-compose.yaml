services:
  api:
    build: .
    ports:
      - "5000:5000"
    depends_on:
      - db
    volumes:
      - ./static:/app/static

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: almoxarifado
      MYSQL_ROOT_PASSWORD: "mysql_root"
    ports:
      - "3306:3306"
    volumes:
      - ./mysql.sql:/docker-entrypoint-initdb.d/mysql.sql